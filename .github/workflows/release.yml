name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish crates and create GitHub release"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tagged commit is on main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "FETCH_HEAD"; then
            echo "Tag ${GITHUB_REF_NAME} points to commit ${GITHUB_SHA} which is not on origin/main"
            exit 1
          fi

      - name: Validate publish ref
        if: github.event_name == 'workflow_dispatch' && inputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Manual publish must be run from a release tag, not ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Validate release version
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo pkgid -p cmdcode | sed -E 's/.*@//')"
          if [[ "${tag_version}" != "${package_version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match Cargo package version ${package_version}" >&2
            exit 1
          fi

      - name: Build release binary
        run: cargo build --release --locked

      - name: Verify binary is named cmdcode
        run: |
          test -f target/release/cmdcode || { echo "Expected binary target/release/cmdcode not found"; exit 1; }

      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar czf dist/cmdcode-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz \
            -C target/release cmdcode
          cd dist && sha256sum cmdcode-*.tar.gz > cmdcode-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.sha256

      - name: Derive publish order from cargo metadata
        # CRATE_PACKAGES is derived from the cargo-metadata dependency graph
        # (dependency-first topological order, runtime AND dev edges included)
        # by scripts/publish-order.py.
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        shell: bash
        run: |
          set -euo pipefail
          echo "CRATE_PACKAGES=$(python3 scripts/publish-order.py --emit | tr '\n' ' ')" >> "${GITHUB_ENV}"

      - name: Publish crates.io packages
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN secret is required to publish crates" >&2
            exit 1
          fi

          crate_version() {
            cargo pkgid -p "$1" | sed -E 's/.*#//; s/.*@//'
          }

          crate_version_published() {
            local crate="$1"
            local version="$2"
            curl --fail --silent --show-error --retry 3 --retry-delay 3 \
              -H "User-Agent: cmdcode-release-ci (curl)" \
              "https://crates.io/api/v1/crates/${crate}/${version}" \
              >/dev/null 2>&1
          }

          for crate in ${CRATE_PACKAGES}; do
            version="$(crate_version "${crate}")"
            if crate_version_published "${crate}" "${version}"; then
              echo "${crate} ${version} already exists on crates.io; skipping"
              continue
            fi
            if ! cargo publish --locked -p "${crate}"; then
              # A concurrent, restartable release may have completed this exact
              # publish between the preflight check and cargo publish. Only
              # tolerate that verified outcome; every other failure aborts.
              if crate_version_published "${crate}" "${version}"; then
                echo "${crate} ${version} was published concurrently; continuing"
                continue
              fi
              echo "Failed to publish ${crate} ${version}" >&2
              exit 1
            fi
            echo "${crate} ${version} published successfully"
            sleep 15
          done

      - name: Verify published crates.io packages
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        shell: bash
        run: |
          set -euo pipefail
          crate_version() {
            cargo pkgid -p "$1" | sed -E 's/.*#//; s/.*@//'
          }
          for crate in ${CRATE_PACKAGES}; do
            version="$(crate_version "${crate}")"
            curl --fail --silent --show-error --retry 5 --retry-delay 5 \
              -H "User-Agent: cmdcode-release-ci (curl)" \
              "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null
            sleep 2
          done

      - name: Extract release notes from CHANGELOG
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Slice the section for this version out of Keep-a-Changelog format:
          # everything between '## [version]' and the next '## ['.
          awk -v ver="[$version]" '
            $0 ~ "^## \\[" ver "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG section found for ${version}" >&2
            echo "See CHANGELOG.md for details." > RELEASE_NOTES.md
          fi

      - name: Publish GitHub release assets
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
