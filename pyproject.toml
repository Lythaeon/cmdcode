[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "command-code-openapi-proxy"
version = "2.0.0"
description = "OpenAI-compatible proxy in front of Command Code's HTTP API — avoid vendor lock-in"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "Lythaeon"}]
keywords = ["openai", "proxy", "command-code", "api", "vendor-lock-in"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
command-code-proxy = "command_code_proxy.proxy:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-timeout>=2.0"]

[project.urls]
Homepage = "https://github.com/Lythaeon/command-code-openapi-proxy"
Repository = "https://github.com/Lythaeon/command-code-openapi-proxy"
Issues = "https://github.com/Lythaeon/command-code-openapi-proxy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
